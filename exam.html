<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Certified Architect – Foundations · Q&A Search</title>
<style>
  :root{
    --bg:#f4f1ea; --card:#fffdf8; --ink:#23201b; --muted:#6b655a;
    --accent:#b5532a; --accent-soft:#f0d9cd; --line:#e4ded2; --hit:#ffe08a;
  }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:10;background:var(--bg);
    padding:18px 16px 12px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 2px;font-size:19px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
  .searchwrap{position:relative}
  #q{width:100%;padding:13px 42px 13px 14px;font-size:17px;border:2px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--ink);outline:none}
  #q:focus{border-color:var(--accent)}
  #clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;
    font-size:20px;color:var(--muted);cursor:pointer;padding:6px;display:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;user-select:none}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .count{color:var(--muted);font-size:13px;margin-top:9px}
  main{max-width:860px;margin:0 auto;padding:14px 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin:11px 0;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .meta{display:flex;gap:8px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
  .num{font-weight:700;color:var(--accent)}
  .tag{font-size:11px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);
    background:var(--accent-soft);border-radius:6px;padding:2px 7px}
  .qtext{font-weight:600;font-size:17px}
  .answer{margin-top:11px;padding:12px 14px;background:#f7f3ea;border-left:4px solid var(--accent);
    border-radius:0 8px 8px 0;font-size:15.5px}
  .alabel{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);margin-bottom:5px;font-weight:700}
  .pick{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;
    background:var(--accent);color:#fff;border-radius:6px;font-weight:700;font-size:13px;margin-left:2px}
  mark{background:var(--hit);color:inherit;border-radius:3px;padding:0 1px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .hint{color:var(--muted);font-size:12px;margin-top:4px}
  kbd{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Claude Certified Architect – Foundations</h1>
  <div class="sub">Practice exams · Set 1 (60 Q) + Set 2 · type a keyword to jump to the answer</div>
  <div class="searchwrap">
    <input id="q" type="search" placeholder="Search questions &amp; answers… (e.g. escalate, batch, fork, stop_reason)" autocomplete="off" autofocus>
    <button id="clear" title="Clear">×</button>
  </div>
  <div class="hint">Question and answer are both shown in full. Results filter as you type — press <kbd>/</kbd> to focus search, <kbd>Esc</kbd> to clear.</div>
  <div class="chips" id="setchips"></div>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
</header>
<main>
  <div id="list"></div>
  <div class="empty" id="empty" style="display:none">No questions match — try a different keyword.</div>
</main>

<script>
const DATA = [
 {n:1,s:1,q:"Claude frequently requests get_customer and lookup_order in separate sequential turns even when both are needed upfront. How do you reduce API round-trips?",a:"B",t:"Create composite tools like get_customer_with_orders that bundle common lookup combinations into single calls."},
 {n:2,s:1,q:"Tools return inconsistent data formats (Unix timestamps, ISO 8601 dates, numeric status codes); some are third-party MCP servers you cannot modify. How do you normalize?",a:"B",t:"Modify tools you control to return human-readable formats; create wrapper tools for third-party tools."},
 {n:3,s:1,q:"Prevent the agent from calling order/refund tools before customer identity is verified (financial-harm reliability).",a:"D",t:"Add a programmatic prerequisite that blocks lookup_order and process_refund calls until get_customer has returned a verified customer ID."},
 {n:4,s:1,q:"A customer message contains multiple distinct concerns. How should the agent handle it?",a:"B",t:"Decompose the request into distinct concerns, then investigate each in parallel using shared customer context before synthesizing a resolution."},
 {n:5,s:1,q:"The agent is miscalibrated on when to escalate vs. resolve autonomously. How to fix?",a:"C",t:"Add explicit escalation criteria to your system prompt with few-shot examples demonstrating when to escalate versus resolve autonomously."},
 {n:6,s:1,q:"How does the application know when to continue the tool loop vs. stop?",a:"C",t:"Check the stop_reason field in Claude's response—continue when it equals \"tool_use\" and stop when it equals \"end_turn\"."},
 {n:7,s:1,q:"Improve tool selection on ambiguous cases.",a:"C",t:"Add 4-6 examples targeting ambiguous scenarios, each showing reasoning for why one tool was chosen over plausible alternatives."},
 {n:8,s:1,q:"First step to fix poor tool selection.",a:"C",t:"Expand each tool's description to include input formats it handles, example queries, edge cases, and boundaries explaining when to use it versus similar tools."},
 {n:9,s:1,q:"Why does Claude misroute \"account\" requests despite good tool descriptions?",a:"D",t:"The model's base training creates associations between \"account\" terminology and customer-related operations that override the tool descriptions."},
 {n:10,s:1,q:"get_customer returns multiple matches for an identifier. What should the agent do?",a:"A",t:"Instruct Claude to ask for an additional identifier (email, phone, or order number) when get_customer returns multiple matches, before taking any customer-specific action."},
 {n:11,s:1,q:"Responses have variable gaps in completeness. Adaptive fix?",a:"B",t:"Add a self-critique step where the agent evaluates its draft response for completeness—ensuring it addresses the customer's concern, includes relevant context, and is accurate."},
 {n:12,s:1,q:"Transactional facts get lost in summarized conversation history.",a:"C",t:"Extract transactional facts (amounts, dates, order numbers) into a persistent \"case facts\" block included in each prompt, outside the summarized history."},
 {n:13,s:1,q:"Handle multi-concern customer messages reliably.",a:"D",t:"Implement a preprocessing layer that uses a separate model call to decompose multi-concern messages into individual requests, process each independently, then combine."},
 {n:14,s:1,q:"First thing to review when tools are mis-selected.",a:"D",t:"Review tool descriptions to ensure they clearly distinguish each tool's purpose."},
 {n:15,s:1,q:"Customer requests a competitor price match; policy allows adjustments for price drops on your own site within 14 days but is silent on competitors.",a:"D",t:"Escalate: the competitor price-match is a genuine policy gap requiring human interpretation."},
 {n:16,s:2,q:"Apply test conventions to test files scattered across the repo (not in one directory).",a:"A",t:"Create rule files in .claude/rules/ with YAML frontmatter specifying glob patterns to conditionally apply conventions based on file paths."},
 {n:17,s:2,q:"Ambiguous Slack-integration architecture decision before implementing.",a:"D",t:"Enter plan mode to explore the integration options and their architectural implications, then present a recommendation before implementing."},
 {n:18,s:2,q:"Bloated CLAUDE.md is hard to maintain.",a:"C",t:"Create separate markdown files in .claude/rules/, each covering one topic (e.g., testing.md, api-conventions.md)."},
 {n:19,s:2,q:"A skill has three issues (missing required params, verbose output pollution, over-broad tool access).",a:"A",t:"Add argument-hint frontmatter to prompt for required parameters, use context: fork to isolate execution, and restrict allowed-tools to file write operations."},
 {n:20,s:2,q:"Verbose Phase 1 exploration output pollutes the main context.",a:"C",t:"Use the Explore subagent for Phase 1 to isolate verbose output and return a summary, then continue Phases 2-3 in the main conversation."},
 {n:21,s:2,q:"A skill's analysis output pollutes the main session.",a:"B",t:"Add context: fork to the skill's frontmatter to run the analysis in an isolated sub-agent context."},
 {n:22,s:2,q:"Personalize a team-shared skill for your own use.",a:"A",t:"Create a personal version in ~/.claude/skills/ with a different name like /my-commit."},
 {n:23,s:2,q:"Isolate exploration discussion from contaminating implementation.",a:"D",t:"Add context: fork to the skill's frontmatter."},
 {n:24,s:2,q:"Use exemplar endpoints as a pattern only when creating new endpoints.",a:"D",t:"Create a skill that references the exemplar endpoints and includes pattern-following instructions, invoked on-demand via slash command."},
 {n:25,s:2,q:"A coding guideline only some developers receive.",a:"D",t:"The guideline exists in the original developers' ~/.claude/CLAUDE.md (user-level) instead of the project's .claude/CLAUDE.md. Move it to the project level."},
 {n:26,s:2,q:"Share an MCP server config with the team without committing credentials.",a:"B",t:"Add the server to a project-scoped .mcp.json with environment variable expansion (${GITHUB_TOKEN}) for authentication, and document the required environment in the README."},
 {n:27,s:2,q:"Organize universal standards vs. task-specific workflows.",a:"C",t:"Keep universal standards in CLAUDE.md and create Skills for task-specific workflows (PR reviews, deployments, migrations) with trigger keywords."},
 {n:28,s:2,q:"Prose instructions for a transformation are ambiguous.",a:"D",t:"Provide 2-3 concrete input-output examples showing the expected transformation for representative API responses."},
 {n:29,s:2,q:"Distribute slash commands to the whole team automatically.",a:"A",t:"Place them in the .claude/commands/ directory in the project repository."},
 {n:30,s:2,q:"Plan a monolith-to-microservices restructuring before coding.",a:"B",t:"Enter plan mode to explore the codebase, understand dependencies, and design an implementation approach before making changes."},
 {n:31,s:3,q:"Context bloat from verbose subagent outputs reaching the coordinator.",a:"B",t:"Modify upstream agents to return structured data (key facts, citations, relevance scores) instead of verbose content and reasoning."},
 {n:32,s:3,q:"Subagents research overlapping material.",a:"D",t:"Have the coordinator explicitly partition the research space before delegation, assigning distinct subtopics or source types to each agent."},
 {n:33,s:3,q:"Document analysis encounters two conflicting figures.",a:"C",t:"Complete the document analysis with both figures included, explicitly annotate the conflict with source attribution, and let the coordinator decide how to reconcile."},
 {n:34,s:3,q:"Error handling for web-search results (failures vs. empty).",a:"D",t:"Distinguish access failures (timeout) needing retry decisions from valid empty results (\"0 results\") representing successful queries."},
 {n:35,s:3,q:"Two sets of findings must be combined.",a:"A",t:"The coordinator passes both sets of findings to the synthesis agent for unified integration."},
 {n:36,s:3,q:"Reduce coordinator overload from subagent errors (transient PDF failures).",a:"B",t:"Have the subagent implement local recovery for transient failures and only propagate errors it cannot resolve to the coordinator, including what was attempted and partial results."},
 {n:37,s:3,q:"Fact verification routing where 85% are simple lookups.",a:"D",t:"Give the synthesis agent a scoped verify_fact tool for simple lookups, while complex verifications continue delegating to the web search agent through the coordinator."},
 {n:38,s:3,q:"Multi-agent error-handling architecture.",a:"A",t:"The coordinator can observe all interactions, handle errors consistently, and decide what information each subagent should receive."},
 {n:39,s:3,q:"45% of \"analyze uploaded report\" requests misrouted to a mislabeled web-search tool.",a:"B",t:"Rename the web search tool to extract_web_results and update its description to \"processes and returns information retrieved from web searches and URLs.\""},
 {n:40,s:3,q:"A corrupted PDF is encountered by a subagent.",a:"D",t:"Return the error with context to the coordinator agent, letting it decide how to proceed."},
 {n:41,s:3,q:"The web search subagent times out on a complex topic; design how the failure flows back to the coordinator to enable intelligent recovery.",a:"B",t:"Return structured error context to the coordinator including the failure type, the attempted query, any partial results, and potential alternative approaches."},
 {n:42,s:3,q:"A document analysis agent given a general-purpose fetch_url tool now frequently fetches search-result pages (ad-hoc web search), causing inconsistent results. Most effective fix?",a:"A",t:"Replace fetch_url with a load_document tool that validates URLs point to document formats."},
 {n:43,s:3,q:"Synthesis reliably cites the first 15K and final 10K tokens but omits critical findings in the middle 50K. How to restructure the aggregated input?",a:"D",t:"Place a key findings summary at the beginning of the aggregated input and organize detailed results with explicit section headers for easier navigation."},
 {n:44,s:3,q:"Web search returned 3 of 5 source categories (2 timed out); synthesis must produce findings from mixed-quality input. Best error-propagation strategy?",a:"A",t:"Structure the synthesis output with coverage annotations indicating which findings are well-supported versus which topic areas have gaps due to unavailable sources."},
 {n:45,s:3,q:"Final reports cover only visual arts; the coordinator decomposed the topic into three visual-arts subtasks. Most likely root cause?",a:"C",t:"The coordinator agent's task decomposition is too narrow, resulting in subagent assignments that don't cover all relevant domains of the topic."},
 {n:46,s:4,q:"A re-review after fixes still re-flags 5 already-fixed issues. Eliminate redundant feedback while keeping thorough analysis.",a:"A",t:"Include prior review findings in context, instructing Claude to only report new or still-unaddressed issues."},
 {n:47,s:4,q:"Reviews are valid but not actionable; detailed instructions still yield inconsistent output. Most reliable prompting technique for consistently actionable feedback?",a:"B",t:"Add 3-4 few-shot examples showing the exact format you want: issue identified, code location, specific fix suggestion."},
 {n:48,s:4,q:"False-positive rates vary by category (style 52%, docs 48%); developers are dismissing findings. Restore trust while improving the system.",a:"B",t:"Temporarily disable high false positive categories (style, naming, documentation) and run only high-precision categories while improving prompts."},
 {n:49,s:4,q:"Subtle issues are only caught by a different reviewer; Claude's generation reasoning considered but dismissed them. Address the root cause of this self-review limitation.",a:"D",t:"Have a second, independent Claude Code instance review the changes without seeing the generator's reasoning."},
 {n:50,s:4,q:"CI runs Claude Code in --print mode producing narrative paragraphs; you want to auto-post each finding as an inline PR comment (needs structured data). Most effective approach?",a:"D",t:"Use CLI flags --output-format json and --json-schema to enforce structured findings, then parse output to post inline comments via the GitHub API."},
 {n:51,s:4,q:"Two modes: a blocking pre-merge-commit hook and an overnight deep analysis that polls. Batches API gives 50% savings but up to 24h. Which mode should use batch?",a:"B",t:"Deep analysis only."},
 {n:52,s:4,q:"Test-case suggestions include 6 duplicates already covered in the existing suite. Most effective change to reduce duplicates?",a:"D",t:"Include the existing test file in the context so Claude can identify what scenarios are already covered."},
 {n:53,s:4,q:"claude \"...\" hangs waiting for interactive input in a pipeline. Correct approach to run Claude Code in an automated pipeline?",a:"A",t:"Add the -p flag: claude -p \"Analyze this pull request for security issues\"."},
 {n:54,s:4,q:"Three analyses: blocking PR style checks, weekly security audits, nightly test generation. Match each task to its API to optimize cost while keeping acceptable developer experience.",a:"D",t:"Use synchronous calls for PR style checks; use the Message Batches API for weekly security audits and nightly test generation."},
 {n:55,s:4,q:"Inconsistent severity ratings (same issue \"critical\" in some PRs, \"medium\" in others). Improve severity consistency.",a:"B",t:"Include explicit severity criteria in your prompt with concrete code examples for each severity level."},
 {n:56,s:4,q:"15 findings/PR, 40% false positives; bottleneck is investigation time (clicking into each finding to read reasoning); filtering before review is rejected. Best change?",a:"B",t:"Require Claude to include its reasoning and confidence assessment inline with each finding."},
 {n:57,s:4,q:"A single-pass review of 14 files produces inconsistent, contradictory results. How should you restructure the review?",a:"A",t:"Split into focused passes: analyze each file individually for local issues, then run a separate integration-focused pass examining cross-file data flow."},
 {n:58,s:4,q:"Reduce API costs: a blocking pre-merge check plus an overnight technical-debt report. Manager proposes switching both to the Batches API. How to evaluate?",a:"B",t:"Use batch processing for the technical debt reports only; keep real-time calls for pre-merge checks."},
 {n:59,s:4,q:"An iterative review uses tool calling (requesting related files mid-analysis). Evaluating batch processing—what is the primary technical constraint?",a:"A",t:"The asynchronous model prevents executing tools mid-request and returning results for Claude to continue analysis."},
 {n:60,s:4,q:"Comment/docstring review over-flags acceptable patterns (TODO markers, plain descriptions) and misses comments describing behavior the code no longer implements. Change addressing the root cause?",a:"A",t:"Specify explicit criteria: flag comments only when their claimed behavior contradicts actual code behavior."},
 {set:2,n:1,s:1,q:"Production logs show the agent frequently calls get_customer when users ask about orders (e.g., \"check my order #12345\"), instead of lookup_order. Both tools have minimal descriptions (\"Retrieves customer information\" / \"Retrieves order details\") and accept similar identifier formats. Most effective first step to improve tool selection reliability?",a:"C",t:"Expand each tool's description to include input formats it handles, example queries, edge cases, and boundaries explaining when to use it versus similar tools."},
 {set:2,n:2,s:1,q:"Progressive summarization at 70% capacity condenses customer-stated amounts (\"the 15% discount I mentioned\") stated 20+ turns ago into vague summaries (\"discussed promotional pricing\"), and the agent responds with incorrect values. Most effective fix?",a:"B",t:"Extract transactional facts (amounts, dates, order numbers) into a persistent \"case facts\" block included in each prompt, outside the summarized history."},
 {set:2,n:3,s:1,q:"The agent misinterprets MCP tool data: Unix timestamps from get_customer, ISO 8601 dates from lookup_order, and numeric status codes (1=pending, 2=shipped); some tools are third-party MCP servers you cannot modify. Most maintainable approach to normalize data formats?",a:"B",t:"Use a PostToolUse hook to intercept tool results and apply formatting transformations before agent processing."},
 {set:2,n:4,s:1,q:"In testing, the agent frequently calls get_customer when users ask about order status, even though lookup_order would be more appropriate. What should you examine first to address this issue?",a:"B",t:"Review tool descriptions to ensure they clearly distinguish each tool's purpose."},
 {set:2,n:5,s:1,q:"After calling get_customer and lookup_order, the agent faces uncertainty. Which situation is the most appropriate trigger for calling escalate_to_human?",a:"A",t:"The customer requests a price match against a competitor; policy allows adjustments for price drops on your own site within 14 days but is silent on competitor pricing—a genuine policy gap requiring human interpretation."},
 {set:2,n:6,s:1,q:"The agent achieves 55% first-contact resolution (target 80%): it escalates straightforward cases (standard damage replacements with photo evidence) while attempting to autonomously handle complex situations requiring policy exceptions. Most effective way to improve escalation calibration?",a:"A",t:"Add explicit escalation criteria to your system prompt with few-shot examples demonstrating when to escalate versus resolve autonomously."},
 {set:2,n:7,s:1,q:"Simple requests (\"refund order #1234\") succeed in 3-4 tool calls at 99%, but complex multi-part requests (\"charged twice, discount didn't apply, want to cancel\") average 12+ tool calls at 54%, investigating concerns sequentially and re-gathering redundant customer data. Most effective change to improve complex request handling?",a:"D",t:"Decompose the request into distinct concerns, then investigate each in parallel using shared customer context before synthesizing a resolution."},
 {set:2,n:8,s:1,q:"When customers include \"account\" in messages, the agent calls get_customer first 78% of the time; without \"account\" it calls lookup_order first 93% of the time. The tool descriptions are well-written and unambiguous. Most likely root cause of this discrepancy?",a:"A",t:"The system prompt contains keyword-sensitive instructions that steer behavior based on terms like \"account,\" creating unintended tool selection patterns."},
 {set:2,n:9,s:1,q:"Implementing the agentic loop: after each API call to Claude you must decide whether to continue the loop (execute requested tools and call Claude again) or stop (present the final response). What determines this decision?",a:"B",t:"Check the stop_reason field in Claude's response—continue when it equals \"tool_use\" and stop when it equals \"end_turn\"."},
 {set:2,n:10,s:1,q:"The agent averages 4+ API round-trips per resolution, frequently requesting get_customer and lookup_order in separate sequential turns even when both are needed upfront. Most effective way to reduce round-trips?",a:"D",t:"Prompt Claude to batch tool requests per turn, and return all tool results together before the next API call."},
 {set:2,n:11,s:1,q:"Single-concern requests resolve at 94% accuracy but multi-concern messages (e.g., \"refund order #1234 and update shipping for #5678\") drop to 58%, with the agent addressing only one concern or mixing up parameters. Most effective approach to improve reliability for multi-concern requests?",a:"A",t:"Add few-shot examples to your prompt demonstrating the correct reasoning and tool sequence for multi-concern requests."},
 {set:2,n:12,s:1,q:"Complex cases (billing disputes, multi-order returns) score 15% lower on CSAT than simple cases even when technically correct: the agent inconsistently explains reasoning, sometimes omitting policy details, other times timelines or next steps—gaps vary by case. Improve quality without human-review overhead. Most effective?",a:"C",t:"Add a self-critique step where the agent evaluates its draft response for completeness—ensuring it addresses the customer's concern, includes relevant context, and anticipates follow-up questions."},
 {set:2,n:13,s:1,q:"In 12% of cases the agent skips get_customer entirely and calls lookup_order using only the customer's stated name, occasionally causing misidentified accounts and incorrect refunds. What change most effectively addresses this reliability issue?",a:"D",t:"Add a programmatic prerequisite that blocks lookup_order and process_refund calls until get_customer has returned a verified customer ID."},
 {set:2,n:14,s:1,q:"get_customer returns all matches when searching by name; Claude picks the customer with the most recent order on multi-match, but 15% of multi-match cases proceed with the wrong account. How should you address this?",a:"A",t:"Instruct Claude to ask for an additional identifier (email, phone, or order number) when get_customer returns multiple matches, before taking any customer-specific action."},
 {set:2,n:15,s:1,q:"The agent sometimes selects get_customer when lookup_order is more appropriate, especially for ambiguous requests (\"I need help with my recent purchase\"). You decide to add few-shot examples. Which approach most effectively improves tool selection?",a:"B",t:"Add 4-6 examples targeting ambiguous scenarios, each showing reasoning for why one tool was chosen over plausible alternatives."},
 {set:2,n:16,s:2,q:"A /migration skill (accepts a name via $ARGUMENTS) has three issues: developers invoke it without arguments (poorly-named files), it incorporates schema details from unrelated earlier conversations, and a developer accidentally triggered destructive test cleanup under broad tool access. Which configuration addresses all three?",a:"C",t:"Add argument-hint frontmatter to prompt for required parameters, use context: fork to isolate execution, and restrict allowed-tools to file write operations."},
 {set:2,n:17,s:2,q:"Adding Slack as a notification channel; existing channels (email/SMS/push) have clear patterns, but Slack offers fundamentally different approaches (incoming webhooks, bot tokens, Slack Apps) and the ticket just says \"add Slack support\" without specifying method or whether delivery tracking is needed. How should you approach this?",a:"B",t:"Enter plan mode to explore the integration options and their architectural implications, then present a recommendation before implementing."},
 {set:2,n:18,s:2,q:"A custom /explore-alternatives skill for brainstorming implementation approaches causes Claude's later responses to reference abandoned approaches or carry exploratory context into actual implementation work. Most effective way to configure this skill?",a:"A",t:"Add context: fork to the skill's frontmatter to isolate the exploration in a separate context."},
 {set:2,n:19,s:2,q:"You want a custom /review slash command running your team's standard code-review checklist, available to every developer when they clone or pull the repository. Where should you create this command file?",a:"A",t:"In the .claude/commands/ directory in the project repository."},
 {set:2,n:20,s:2,q:"CLAUDE.md has grown to 400+ lines (coding standards, testing conventions, PR review checklist, deployment instructions, migration procedures). You want coding/testing always applied, but PR review, deployment, and migration guidance only when performing those tasks. Most effective restructuring?",a:"D",t:"Keep universal standards in CLAUDE.md and create Skills for task-specific workflows (PR reviews, deployments, migrations) with trigger keywords."},
 {set:2,n:21,s:2,q:"Claude Code is implementing a function that transforms API responses into a normalized internal format. After two iterations the output structure still doesn't match (fields nested differently, timestamps wrong); prose requirements get interpreted differently each time. Most effective approach for the next iteration?",a:"D",t:"Provide 2-3 concrete input-output examples showing the expected transformation for representative API responses."},
 {set:2,n:22,s:2,q:"An /analyze-codebase skill performs comprehensive analysis (dependency scanning, coverage, quality metrics); after running it, Claude becomes less responsive and loses track of the original task. Most effective fix while preserving full analysis capability?",a:"C",t:"Add context: fork to the skill's frontmatter to run the analysis in an isolated sub-agent context."},
 {set:2,n:23,s:2,q:"A /commit skill in .claude/skills/commit/SKILL.md is team-shared; one developer wants to customize it (different message format, extra checks) without affecting teammates. What should you recommend?",a:"D",t:"Create a personal version in ~/.claude/skills/ with a different name like /my-commit."},
 {set:2,n:24,s:2,q:"The codebase has area-specific conventions (React functional+hooks, async/await API handlers, repository-pattern DB models); test files sit alongside the code they test (Button.test.tsx next to Button.tsx) and all tests should follow the same conventions regardless of location. Most maintainable way for Claude to auto-apply the right conventions?",a:"C",t:"Create rule files in .claude/rules/ with YAML frontmatter specifying glob patterns to conditionally apply conventions based on file paths."},
 {set:2,n:25,s:2,q:"Three developers find Claude follows the \"always include comprehensive error handling\" guideline, but a newly-joined fourth developer doesn't—all in the same repo with latest code pulled. Most likely cause and fix?",a:"A",t:"The guideline exists in the original developers' ~/.claude/CLAUDE.md (user level) instead of the project's .claude/CLAUDE.md—move the instruction to the project level so all team members receive it."},
 {set:2,n:26,s:2,q:"You're assigned to restructure a monolith into microservices: changes across dozens of files and decisions about service boundaries and module dependencies. Which approach should you take?",a:"A",t:"Enter plan mode to explore the codebase, understand dependencies, and design an implementation approach before making changes."},
 {set:2,n:27,s:2,q:"A 500+ line CLAUDE.md mixes TypeScript conventions, testing guidelines, API patterns, and deployment procedures, making sections hard to find and update. What approach does Claude Code support for organizing project instructions into focused topic modules?",a:"B",t:"Create separate markdown files in .claude/rules/, each covering one topic (e.g., testing.md, api-conventions.md)."},
 {set:2,n:28,s:2,q:"Adding error-handling wrappers across a 120-file codebase in three phases (discover call sites, design approach, implement); Phase 1 generates verbose output listing hundreds of call sites and the context window fills before discovery finishes. Most effective approach while maintaining implementation consistency?",a:"D",t:"Use the Explore subagent for Phase 1 to isolate verbose output and return a summary, then continue Phases 2-3 in the main conversation."},
 {set:2,n:29,s:2,q:"Your team wants a GitHub MCP server for PR lookups and CI status via Claude Code; each of six developers has their own personal access token, and you want consistent tooling without committing credentials. Most effective configuration approach?",a:"C",t:"Add the server to a project-scoped .mcp.json with environment variable expansion (${GITHUB_TOKEN}) for authentication, and document the required environment variable in the project README."},
 {set:2,n:30,s:2,q:"Including 2-3 full exemplar endpoint implementations as context improves consistency when generating new API endpoints, but that context is only useful for creating new endpoints—not bug fixes, code reviews, or other API directory work. Most efficient configuration approach?",a:"C",t:"Create a skill that references the exemplar endpoints and includes pattern-following instructions, invoked on-demand via slash command."},
 {set:2,n:31,s:4,q:"CI has two Claude-powered review modes: a pre-merge-commit hook that blocks PR merging until complete, and overnight \"deep analysis\" that polls for batch completion then posts suggestions. The Message Batches API gives 50% savings but may take up to 24h. Which mode should use batch processing?",a:"D",t:"Deep analysis only."},
 {set:2,n:32,s:4,q:"Automated code review gives inconsistent severity ratings—similar null-pointer risks are \"critical\" in some PRs but \"medium\" in others—and developer trust is declining. Most effective way to improve severity consistency?",a:"D",t:"Include explicit severity criteria in your prompt with concrete code examples for each severity level."},
 {set:2,n:33,s:4,q:"An initial review produces 12 findings; a developer pushes fixes; the re-review produces 8 findings but 5 duplicate earlier comments on code already fixed in the new commits. Most effective way to eliminate redundant feedback while maintaining thorough analysis?",a:"D",t:"Include prior review findings in context, instructing Claude to only report new or still-unaddressed issues."},
 {set:2,n:34,s:4,q:"Reviews average 15 findings/PR at a 40% false-positive rate; the bottleneck is investigation time (clicking into each finding to read the reasoning). CLAUDE.md already has acceptable-pattern rules, and stakeholders rejected any approach that filters findings before developer review. Best change to address the investigation-time bottleneck?",a:"C",t:"Require Claude to include its reasoning and confidence assessment inline with each finding."},
 {set:2,n:35,s:4,q:"Three Claude-powered analyses: quick PR style checks that block merging, weekly full-codebase security audits, and nightly test generation for modified modules. Batches API gives 50% savings but up to 24h. Which combination correctly matches each task to its API approach?",a:"B",t:"Use synchronous calls for PR style checks; use the Message Batches API for weekly security audits and nightly test generation."},
 {set:2,n:36,s:4,q:"A comment/docstring review prompt says \"check that comments are accurate and up-to-date.\" It frequently flags acceptable patterns (TODO markers, plain descriptions) while missing comments describing behavior the code no longer implements. Change that addresses the root cause of this inconsistent analysis?",a:"A",t:"Specify explicit criteria: flag comments only when their claimed behavior contradicts actual code behavior."},
 {set:2,n:37,s:4,q:"Test-case suggestions for a PR adding course-completion tracking: Claude suggests 10 cases but developers report 6 duplicate scenarios already covered in the existing suite. What change would most effectively reduce duplicate suggestions?",a:"C",t:"Include the existing test file in the context so Claude can identify what scenarios are already covered."},
 {set:2,n:38,s:4,q:"An iterative review lets Claude request related files (imports, base classes, tests) via tool calling, receive results, and continue its analysis. Evaluating batch processing to cut costs—what is the primary technical constraint for this workflow?",a:"A",t:"The asynchronous model prevents executing tools mid-request and returning results for Claude to continue analysis."},
 {set:2,n:39,s:4,q:"A PR modifies 14 files; the single-pass review of all files together is inconsistent—detailed for some files, superficial for others, missing obvious bugs, and contradictory (flagging a pattern in one file while approving identical code elsewhere in the same PR). How should you restructure the review?",a:"C",t:"Split into focused passes: analyze each file individually for local issues, then run a separate integration-focused pass examining cross-file data flow."},
 {set:2,n:40,s:4,q:"Two real-time workflows: a blocking pre-merge check that must complete before developers merge, and an overnight technical-debt report reviewed the next morning. Manager proposes switching both to the Message Batches API for 50% savings. How should you evaluate this?",a:"C",t:"Use batch processing for the technical debt reports only; keep real-time calls for pre-merge checks."},
 {set:2,n:41,s:4,q:"Subtle issues (performance optimizations that break edge cases, cleanups that change behavior) only surface when a different team member reviews the PR; the generator's own reasoning shows it considered these cases but concluded its approach was correct. Approach that directly addresses the root cause of this self-review limitation?",a:"C",t:"Have a second, independent Claude Code instance review the changes without seeing the generator's reasoning."},
 {set:2,n:42,s:4,q:"CI runs the Claude Code CLI in --print mode for reviews; findings are insightful but come as narrative paragraphs that must be manually copied into PR comments. You want to auto-post each finding as a separate inline PR comment (needs file path, line, severity, suggested fix). Most effective approach?",a:"D",t:"Use CLI flags --output-format json and --json-schema to enforce structured findings, then parse output to post inline comments via the GitHub API."},
 {set:2,n:43,s:4,q:"False-positive rates vary by category (security/correctness 8%, performance 18%, style 52%, documentation 48%); developers are dismissing all findings because \"half are wrong,\" undermining the accurate categories. Approach that best restores trust while improving the system?",a:"D",t:"Temporarily disable high false-positive categories (style, naming, documentation) and run only high-precision categories while improving prompts."},
 {set:2,n:44,s:4,q:"Reviews identify valid issues but aren't actionable (\"complex ticket allocation logic,\" \"potential null pointer\" without saying what to change); adding instructions like \"always include specific fix suggestions\" still yields inconsistent output. Prompting technique that most reliably produces consistently actionable feedback?",a:"D",t:"Add 3-4 few-shot examples showing the exact format you want: issue identified, code location, specific fix suggestion."},
 {set:2,n:45,s:4,q:"A pipeline script runs claude \"Analyze this pull request for security issues\" but the job hangs waiting for interactive input. Correct approach to run Claude Code in an automated pipeline?",a:"A",t:"Add the -p flag: claude -p \"Analyze this pull request for security issues\"."},
 {set:2,n:46,s:3,q:"On \"impact of AI on creative industries\" every subagent succeeds, but final reports cover only visual arts (missing music, writing, film); the coordinator's logs show it decomposed the topic into \"AI in digital art creation,\" \"AI in graphic design,\" and \"AI in photography.\" Most likely root cause?",a:"A",t:"The coordinator agent's task decomposition is too narrow, resulting in subagent assignments that don't cover all relevant domains of the topic."},
 {set:2,n:47,s:3,q:"A web search subagent queries three source categories: academic databases returned 15 papers, industry reports returned \"0 results found,\" and patent databases returned \"Connection timeout.\" When designing error propagation to the coordinator, what approach enables the best recovery decisions?",a:"B",t:"Distinguish access failures (timeout) needing retry decisions from valid empty results (\"0 results\") representing successful queries."},
 {set:2,n:48,s:3,q:"On a broad topic the web search agent and document analysis agent both investigate the same subtopics, doubling token usage with significant finding overlap and no proportional gain in breadth or depth. Most effective way to address this?",a:"A",t:"Have the coordinator explicitly partition the research space before delegation, assigning distinct subtopics or source types to each agent."},
 {set:2,n:49,s:3,q:"The web search subagent returns 3 of 5 source categories (two timed out) while document analysis processed all provided docs; synthesis must produce a findings summary from this mixed-quality input. Most effective error-propagation strategy?",a:"B",t:"Structure the synthesis output with coverage annotations indicating which findings are well-supported versus which topic areas have gaps due to unavailable sources."},
 {set:2,n:50,s:3,q:"The document analysis subagent encounters a corrupted PDF it cannot parse. When designing the system's error handling, what is the most effective way to handle this failure?",a:"D",t:"Return the error with context to the coordinator agent, letting it decide how to proceed."},
 {set:2,n:51,s:3,q:"With ~75K tokens of aggregated results, the synthesis agent reliably cites the first 15K (web search headlines/snippets) and final 10K (document analysis conclusions) but omits critical findings in the middle 50K—even when they directly address the question. How should you restructure the aggregated input?",a:"C",t:"Place a key findings summary at the beginning of the aggregated input and organize detailed results with explicit section headers for easier navigation."},
 {set:2,n:52,s:3,q:"A colleague suggests having the document analysis agent send output directly to the synthesis agent instead of routing through the coordinator. What is the main advantage of keeping the coordinator as the central hub for all subagent communication?",a:"C",t:"The coordinator can observe all interactions, handle errors consistently, and decide what information each subagent should receive."},
 {set:2,n:53,s:3,q:"The document analysis subagent frequently fails on PDFs (corrupted sections, password protection, parser timeouts on large files); any exception immediately terminates the subagent and forces the coordinator to decide retry/skip/fail, causing excessive coordinator involvement in routine error handling. Most effective architectural improvement?",a:"A",t:"Have the subagent implement local recovery for transient failures and only propagate errors it cannot resolve to the coordinator, including what was attempted and any partial results obtained."},
 {set:2,n:54,s:3,q:"The web search subagent times out while researching a complex topic; you must design how the failure flows back to the coordinator. Which error propagation approach best enables intelligent recovery?",a:"D",t:"Return structured error context to the coordinator including the failure type, the attempted query, any partial results, and potential alternative approaches."},
 {set:2,n:55,s:3,q:"Combined outputs from the web search agent (85K tokens incl. page content) and document analysis agent (70K tokens incl. reasoning chains) total 155K, but the synthesis agent performs optimally under 50K tokens. Most effective solution?",a:"D",t:"Modify upstream agents to return structured data (key facts, citations, relevance scores) instead of verbose content and reasoning."}
];
const SCEN = {1:"Customer Support",2:"Claude Code",3:"Multi-Agent Research",4:"CI / Code Review"};

const list=document.getElementById('list'), empty=document.getElementById('empty'),
      countEl=document.getElementById('count'), input=document.getElementById('q'),
      clearBtn=document.getElementById('clear'), chipsEl=document.getElementById('chips'),
      setchipsEl=document.getElementById('setchips');
let scen=0, setFilter=0;

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hl(s,terms){let h=esc(s);for(const t of terms){if(!t)continue;
  const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');h=h.replace(re,'<mark>$1</mark>')}return h}

function render(){
  const raw=input.value.trim();
  const terms=raw.toLowerCase().split(/\s+/).filter(Boolean);
  clearBtn.style.display=raw?'block':'none';
  const rows=DATA.filter(d=>{
    if(setFilter&&(d.set||1)!==setFilter)return false;
    if(scen&&d.s!==scen)return false;
    if(!terms.length)return true;
    const hay=(d.n+' '+d.q+' '+d.a+' '+d.t).toLowerCase();
    return terms.every(t=>hay.includes(t));
  });
  countEl.textContent=rows.length+' of '+DATA.length+' question'+(rows.length===1?'':'s')+(setFilter?' · Set '+setFilter:'')+(scen?' · '+SCEN[scen]:'')+(raw?' · "'+raw+'"':'');
  empty.style.display=rows.length?'none':'block';
  list.innerHTML=rows.map(d=>`
    <div class="card">
      <div class="meta"><span class="num">S${d.set||1}·Q${d.n}</span><span class="tag">${SCEN[d.s]}</span></div>
      <div class="qtext">${hl(d.q,terms)}</div>
      <div class="answer"><span class="alabel">Answer <span class="pick">${d.a}</span></span> ${hl(d.t,terms)}</div>
    </div>`).join('');
}

setchipsEl.innerHTML=[[0,'All sets'],[1,'Set 1'],[2,'Set 2']]
  .map(([v,l])=>`<span class="chip${v===0?' active':''}" data-set="${v}">${l}</span>`).join('');
setchipsEl.addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;
  setFilter=+c.dataset.set;[...setchipsEl.children].forEach(x=>x.classList.toggle('active',+x.dataset.set===setFilter));render()});

chipsEl.innerHTML=[[0,'All'],[1,SCEN[1]],[2,SCEN[2]],[3,SCEN[3]],[4,SCEN[4]]]
  .map(([v,l])=>`<span class="chip${v===0?' active':''}" data-s="${v}">${l}</span>`).join('');
chipsEl.addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;
  scen=+c.dataset.s;[...chipsEl.children].forEach(x=>x.classList.toggle('active',+x.dataset.s===scen));render()});

input.addEventListener('input',render);
clearBtn.addEventListener('click',()=>{input.value='';input.focus();render()});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==input){e.preventDefault();input.focus()}
  if(e.key==='Escape'){input.value='';render();input.blur()}
});
render();
</script>
</body>
</html>
